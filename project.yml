name: Tinycast
options:
  bundleIdPrefix: com.tinycast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Stable self-signed identity so macOS keeps the Accessibility grant across rebuilds.
    # Create it once — see docs/signing.md.
    CODE_SIGN_IDENTITY: "Tinycast Self-Signed"
    SWIFT_STRICT_CONCURRENCY: complete
    TINYCAST_BUNDLE_IDENTIFIER: com.tinycast.app
  configs:
    Debug:
      TINYCAST_BUNDLE_IDENTIFIER: com.tinycast.app.dev
      DICTATION_EXECUTABLE_NAME: Tinycast Dev Dictation
    Release:
      DICTATION_EXECUTABLE_NAME: Tinycast Dictation
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Tinycast:
    type: application
    platform: macOS
    sources:
      - path: Tinycast
        # The helper's own sources: compiling them in would link Vision and PDFKit into the app,
        # which is the whole thing running recognition out of process avoids.
        excludes:
          - Features/Clipboard/Service/ClipboardTextExtractor.swift
          - Features/Clipboard/Service/ClipboardTextHelper.swift
          - Features/PowerMode/Helper/PowerModeHelper.swift
          - Features/Dictation/Helper
          - Features/FileSearch/Helper
          - Resources/EmojiKeywords
      # A folder reference keeps the packs in their own directory, which `EmojiIndex` lists.
      - path: Tinycast/Resources/EmojiKeywords
        type: folder
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    dependencies:
      - target: DictationHelper
        link: false
        embed: false
      # Resolve the embedded helper against the active channel, not Xcode's default configuration.
      - framework: "$(BUILT_PRODUCTS_DIR)/$(DICTATION_EXECUTABLE_NAME).app"
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: ClipboardTextHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: PowerModeHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # The crawl runs out of process, so its memory is returned when the helper exits.
      - target: FileIndexHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    # SMAppService finds a daemon's job by this plist; its label carries the bundle id per channel.
    postBuildScripts:
      - name: Write the power-mode helper's launchd job
        basedOnDependencyAnalysis: false
        showEnvVars: false
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Library/LaunchDaemons/$(PRODUCT_BUNDLE_IDENTIFIER).power-mode.plist
        script: |
          set -euo pipefail
          label="${PRODUCT_BUNDLE_IDENTIFIER}.power-mode"
          dir="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          mkdir -p "$dir"
          rm -f "$dir"/*.power-mode.plist
          plist="$dir/$label.plist"
          /usr/libexec/PlistBuddy -c "Add :Label string $label" \
            -c "Add :BundleProgram string Contents/Helpers/PowerModeHelper" \
            -c "Add :ProgramArguments array" \
            -c "Add :ProgramArguments:0 string PowerModeHelper" \
            -c "Add :ProgramArguments:1 string ${PRODUCT_BUNDLE_IDENTIFIER}" \
            -c "Add :MachServices dict" \
            -c "Add :MachServices:$label bool true" \
            -c "Add :AssociatedBundleIdentifiers array" \
            -c "Add :AssociatedBundleIdentifiers:0 string ${PRODUCT_BUNDLE_IDENTIFIER}" \
            "$plist" >/dev/null
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(TINYCAST_BUNDLE_IDENTIFIER)"
        INFOPLIST_FILE: Tinycast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Tinycast/Tinycast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: tinycast
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel, like beta/stable in release.yml: a distinct bundle id means a
        # locally-run build gets its own prefs, caches, TCC grants and login item instead of
        # inheriting — and corrupting — the installed app's state.
        Debug:
          PRODUCT_NAME: Tinycast Dev

  PowerModeHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Features/PowerMode/Helper/PowerModeHelper.swift
      - Tinycast/Features/PowerMode/Model/PowerMode.swift
      - Tinycast/Features/PowerMode/Model/PowerModeHelperMessage.swift
      - Tinycast/Platform/ProcessExit.swift
    settings:
      base:
        # Pinned for the same reason as ClipboardTextHelper's: release.yml renames every target.
        EXECUTABLE_NAME: PowerModeHelper
        PRODUCT_MODULE_NAME: PowerModeHelper
        SKIP_INSTALL: YES

  ClipboardTextHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Features/Clipboard/Service/ClipboardTextExtractor.swift
      - Tinycast/Features/Clipboard/Service/ClipboardTextHelper.swift
    settings:
      base:
        # release.yml passes PRODUCT_NAME on the xcodebuild line, which hits every target: without
        # these two pinned, a channel build renames the executable `ClipboardTextWorker` looks for
        # and gives the module a name with a space in it.
        EXECUTABLE_NAME: ClipboardTextHelper
        PRODUCT_MODULE_NAME: ClipboardTextHelper
        SKIP_INSTALL: YES

  FileIndexHelper:
    type: tool
    platform: macOS
    sources:
      - Tinycast/Features/FileSearch/Helper/FileIndexHelper.swift
      - Tinycast/Features/FileSearch/Model/FileSearchIgnoreList.swift
      - Tinycast/Features/FileSearch/Model/FileSearchPolicy.swift
      - Tinycast/Features/FileSearch/Model/FileSearchQuery.swift
      - Tinycast/Features/FileSearch/Model/FileSearchScope.swift
      - Tinycast/Features/FileSearch/Service/FileIndexCrawler.swift
      - Tinycast/Features/FileSearch/Service/FileIndexSnapshot.swift
    settings:
      base:
        # Pinned like ClipboardTextHelper's: release.yml's PRODUCT_NAME would otherwise rename it.
        EXECUTABLE_NAME: FileIndexHelper
        PRODUCT_MODULE_NAME: FileIndexHelper
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O

  DictationHelper:
    type: application
    platform: macOS
    info:
      path: Tinycast/Features/Dictation/Helper/Info.plist
      properties:
        CFBundleName: "$(DICTATION_EXECUTABLE_NAME)"
        CFBundleDisplayName: "$(DICTATION_EXECUTABLE_NAME)"
        LSUIElement: true
    sources:
      - Tinycast/Features/Dictation/Helper
      - Tinycast/Features/Dictation/Model/DictationModel.swift
      - Tinycast/Features/Dictation/Model/DictationAudioChunks.swift
      - Tinycast/Features/Dictation/Model/DictationLanguage.swift
      - Tinycast/Features/Dictation/Service/DictationWire.swift
    settings:
      base:
        EXECUTABLE_NAME: "$(DICTATION_EXECUTABLE_NAME)"
        PRODUCT_NAME: "$(DICTATION_EXECUTABLE_NAME)"
        WRAPPER_NAME: "$(DICTATION_EXECUTABLE_NAME).app"
        PRODUCT_MODULE_NAME: DictationHelper
        PRODUCT_BUNDLE_IDENTIFIER: "$(TINYCAST_BUNDLE_IDENTIFIER).dictation"
        SKIP_INSTALL: YES
        SWIFT_OPTIMIZATION_LEVEL: -O
